		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":35445440,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

</style>
<section id="landscape-gate" role="dialog" aria-modal="true" aria-labelledby="landscape-title" hidden>
  <div class="landscape-panel">
    <div class="landscape-phone" aria-hidden="true"></div>
    <h1 id="landscape-title">请横屏游玩</h1>
    <p id="landscape-message" role="status">请关闭手机竖屏锁定，将手机横过来。</p>
    <button id="landscape-enter" type="button">尝试横屏全屏</button>
  </div>
</section>
<button id="landscape-fullscreen" type="button" hidden>全屏游玩</button>
<script>
(() => {
  const gate = document.getElementById('landscape-gate');
  const title = document.getElementById('landscape-title');
  const message = document.getElementById('landscape-message');
  const enter = document.getElementById('landscape-enter');
  const fullscreen = document.getElementById('landscape-fullscreen');
  const canvas = document.getElementById('canvas');
  const touchDevice = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
  let entered = !touchDevice;
  let requesting = false;
  let manualRotation = false;
  const portrait = () => window.innerHeight > window.innerWidth;
  const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const canFullscreen = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);

  function update() {
    const blocked = portrait() || !entered;
    const wasBlocked = !gate.hidden;
    gate.hidden = !blocked;
    canvas.inert = blocked;
    canvas.style.visibility = blocked ? 'hidden' : '';
    fullscreen.hidden = blocked || !touchDevice || inFullscreen() || !canFullscreen();
    title.textContent = portrait() ? '请横屏游玩' : '不服 SOLO';
    message.textContent = portrait()
      ? (manualRotation ? '请手动关闭竖屏锁定，再将手机横过来。竖屏期间对局会暂停。' : '请关闭手机竖屏锁定，将手机横过来。')
      : '横屏操作，准备开始冒险。';
    enter.textContent = requesting ? '正在切换…' : (portrait() ? '尝试横屏全屏' : '进入游戏');
    enter.disabled = requesting;
    if (blocked && document.activeElement === canvas) canvas.blur();
    if (!blocked && wasBlocked) canvas.focus();
  }

  async function enterLandscape() {
    if (requesting) return;
    entered = true;
    requesting = true;
    // Keep the fullscreen request in this user-gesture handler.
    const root = document.documentElement;
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!inFullscreen() && request) {
      try { await request.call(root); } catch (_) { /* Manual rotation remains available. */ }
    }
    if (screen.orientation && typeof screen.orientation.lock === 'function') {
      try { await screen.orientation.lock('landscape'); } catch (_) { manualRotation = true; }
    } else {
      manualRotation = true;
    }
    requesting = false;
    update();
  }

  enter.addEventListener('click', enterLandscape);
  fullscreen.addEventListener('click', enterLandscape);
  window.addEventListener('resize', update);
  document.addEventListener('fullscreenchange', update);
  document.addEventListener('webkitfullscreenchange', update);
  if (screen.orientation) screen.orientation.addEventListener('change', update);
  // A hidden canvas must not keep receiving keyboard gameplay shortcuts.
  for (const type of ['keydown', 'keyup']) {
    document.addEventListener(type, event => {
      if (!gate.hidden && event.target !== enter) event.stopImmediatePropagation();
    }, true);
  }
  update();
})();
</script>
